<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>RestoRUN — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold: #C79A46;
    --cream: #F3EEDF;
    --muted: #C9CFC1;
    --red: #E7847A;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Inter', sans-serif;
    min-height:100vh;
    background: url('restorun-bg.jpg') center center / cover no-repeat fixed;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    position:relative;
  }
  body::before{
    content:''; position:fixed; inset:0;
    background: linear-gradient(180deg, rgba(10,15,12,.35), rgba(10,15,12,.55));
    z-index:0;
  }

  .card{
    position:relative; z-index:1;
    width:100%; max-width: 320px;
    background: rgba(20, 28, 24, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 30px 26px 26px;
    box-shadow: 0 25px 60px rgba(0,0,0,.4);
  }

  .brand{ text-align:center; margin-bottom: 22px; }
  .brand-mark{
    width:46px; height:46px; border-radius:50%;
    border: 1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 10px;
    font-family:'Fraunces', serif; font-weight:700; font-size:15px; color: var(--gold);
  }
  .brand h1{
    font-family:'Fraunces', serif; font-weight:700; font-size: 22px; margin:0;
    color: #fff; letter-spacing:.01em;
  }
  .brand p{ font-size:11px; color: var(--muted); margin:4px 0 0; letter-spacing:.08em; text-transform:uppercase; }

  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:11.5px; color: var(--muted); margin-bottom: 5px; }
  .field input{
    width:100%; padding: 11px 13px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.25);
    color: #fff; font-size: 14px; outline:none;
    font-family:'Inter', sans-serif;
  }
  .field input::placeholder{ color: rgba(255,255,255,0.35); }
  .field input:focus{ border-color: var(--gold); }

  .remember{ display:flex; align-items:center; gap:8px; margin: 16px 0 18px; }
  .remember input{ width:15px; height:15px; accent-color: var(--gold); cursor:pointer; }
  .remember label{ font-size:12.5px; color: var(--muted); cursor:pointer; }

  .err{ color: var(--red); font-size: 12px; margin: -6px 0 12px; min-height: 14px; }

  button.submit{
    width:100%; padding: 12px; border:none; border-radius: 10px;
    background: var(--gold); color: #1b1206; font-weight:700; font-size: 14.5px;
    cursor:pointer; font-family:'Inter', sans-serif;
  }
  button.submit:disabled{ opacity:.6; cursor:default; }
  button.submit:active:not(:disabled){ filter: brightness(0.94); }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">RR</div>
    <h1>RestoRUN</h1>
    <p>Вход для менеджера</p>
  </div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="field">
      <label>Логин</label>
      <input type="text" id="loginInput" placeholder="Введите логин" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="passInput" placeholder="Введите пароль" autocomplete="current-password" required>
    </div>
    <div class="remember">
      <input type="checkbox" id="rememberBox" checked>
      <label for="rememberBox">Оставаться в системе</label>
    </div>
    <div class="err" id="errMsg"></div>
    <button type="submit" class="submit" id="submitBtn">Войти</button>
  </form>
</div>

<script>
const WS_URL = "wss://go-pub-orders.kuatov-party.workers.dev/ws";
const EXPECTED_LOGIN = "olzhas@gopub";

function doLogin(e){
  e.preventDefault();
  const login = document.getElementById('loginInput').value.trim();
  const pass = document.getElementById('passInput').value.trim();
  const remember = document.getElementById('rememberBox').checked;
  const errEl = document.getElementById('errMsg');
  const btn = document.getElementById('submitBtn');
  errEl.textContent = '';

  if(login.toLowerCase() !== EXPECTED_LOGIN){
    errEl.textContent = 'Неверный логин или пароль.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Входим…';

  let settled = false;
  let socket;
  try{ socket = new WebSocket(WS_URL); }
  catch(e){ showError('Не удалось подключиться. Проверьте связь.'); return; }

  const timeout = setTimeout(() => {
    if(!settled){ settled = true; socket.close(); showError('Сервер не отвечает. Попробуйте ещё раз.'); }
  }, 8000);

  socket.onopen = () => socket.send(JSON.stringify({type:"hello", role:"manager", pin: pass}));
  socket.onmessage = (evt) => {
    if(settled) return;
    let msg;
    try{ msg = JSON.parse(evt.data); }catch(err){ return; }
    if(msg.type === "auth_ok"){
      settled = true;
      clearTimeout(timeout);
      if(remember){
        localStorage.setItem('gopub_pin_manager', pass);
        sessionStorage.setItem('gopub_pin_manager', pass);
      } else {
        sessionStorage.setItem('gopub_pin_manager', pass);
        localStorage.removeItem('gopub_pin_manager');
      }
      socket.close();
      location.href = 'manager.html';
    }
    if(msg.type === "auth_error"){
      settled = true;
      clearTimeout(timeout);
      socket.close();
      showError('Неверный логин или пароль.');
    }
  };
  socket.onerror = () => { if(!settled){ settled = true; clearTimeout(timeout); showError('Не удалось подключиться. Проверьте связь.'); } };

  function showError(text){
    document.getElementById('errMsg').textContent = text;
    btn.disabled = false;
    btn.textContent = 'Войти';
  }
}
</script>
</body>
</html>
